const animals=[{id:'cow',name:'Cow',emoji:'🐄',type:'Ruminant',summary:'Cattle are foregut fermenters. Microbes in the rumen help break down fiber before feed reaches the true stomach.',organs:[['Mouth','Chews and mixes feed with saliva.'],['Esophagus','Moves swallowed feed to the stomach; cud can return to the mouth for rechewing.'],['Rumen','Large fermentation chamber where microbes digest fiber and produce usable energy compounds.'],['Reticulum','Works with the rumen, helps sort material and supports cud regurgitation.'],['Omasum','Absorbs water and some fermentation products as material passes through.'],['Abomasum','The true stomach; acid and enzymes digest feed and microbial proteins.'],['Small intestine','Digests and absorbs many nutrients.'],['Large intestine','Absorbs water and supports some additional fermentation.']]},{id:'pig',name:'Pig',emoji:'🐖',type:'Monogastric',summary:'Pigs have one stomach chamber. Enzymes do most of the work digesting a balanced diet.',organs:[['Mouth','Chews feed and mixes it with saliva.'],['Esophagus','Carries feed to the stomach.'],['Stomach','Uses acid and enzymes to begin breaking down proteins.'],['Small intestine','Completes much digestion and absorbs most nutrients.'],['Large intestine','Absorbs water and allows limited microbial fermentation.']]},{id:'horse',name:'Horse',emoji:'🐎',type:'Hindgut fermenter',summary:'Horses have a simple stomach but use microbes in the cecum and large colon to ferment fiber. Forage is especially important.',organs:[['Mouth','Grinds forage thoroughly with teeth.'],['Esophagus','Moves feed toward the stomach.'],['Stomach','Small simple stomach begins acid and enzyme digestion.'],['Small intestine','Digests and absorbs many nutrients before hindgut fermentation.'],['Cecum','Microbes ferment fiber.'],['Large colon','Continues fermentation and absorbs water and fermentation products.'],['Small colon','Absorbs water and forms feces.']]},{id:'chicken',name:'Chicken',emoji:'🐔',type:'Avian',summary:'Chickens have no teeth. Feed is stored briefly, chemically digested, then mechanically ground in the gizzard.',organs:[['Beak & mouth','Collects and swallows feed with little chewing.'],['Esophagus','Moves feed to the crop.'],['Crop','Temporarily stores and softens feed.'],['Proventriculus','Glandular stomach secretes acid and digestive enzymes.'],['Gizzard','Muscular organ grinds feed mechanically.'],['Small intestine','Digests and absorbs nutrients.'],['Ceca','Paired pouches where some microbial fermentation occurs.'],['Cloaca','Common exit for digestive and other body wastes.']]}];
const nutrients=[['💧','Water','Hydration, temperature control, circulation, digestion, and waste removal.','Clean, accessible drinking water.'],['🌾','Carbohydrates','Supply energy; fermentable fiber also supports digestive function.','Forage, grains, and other plant feeds.'],['🥚','Proteins','Provide amino acids for growth, tissue repair, enzymes, and production.','Legumes, soybean meal, balanced formulated feeds.'],['🥜','Fats','Provide concentrated energy and aid absorption of fat-soluble vitamins.','Oilseeds and carefully formulated added fats.'],['☀️','Vitamins','Support metabolism, growth, immunity, and other body processes.','Appropriate feeds, fortified rations, or targeted supplements.'],['🦴','Minerals','Support bones, nerves, muscles, fluid balance, and production.','Forages, formulated feeds, and species-appropriate mineral mixes.']];
const cases=[{name:'Growing calf',emoji:'🐄',prompt:'A growing calf needs a balanced diet to develop bone and muscle. Which priority makes the most sense?',options:['Adequate energy and protein plus minerals, vitamins, and water','Only extra fat, with no attention to protein','Limit clean water to reduce feed costs'],answer:0,why:'Growing animals require sufficient energy and protein for development, along with the other essential nutrients.'},{name:'Lactating cow',emoji:'🥛',prompt:'A cow is producing milk. What should the manager check first?',options:['Whether her ration and water supply meet increased lactation needs','Whether she can eat the exact same ration as every dry cow','Whether vitamins can replace all forage'],answer:0,why:'Milk production raises demand for nutrients and water; the ration should match her production stage.'},{name:'Performance horse',emoji:'🐎',prompt:'A working horse needs a safe feeding plan. Which principle is strongest?',options:['Start with adequate forage and water; adjust energy to workload','Replace all hay with grain','Use a cattle mineral mix without checking species suitability'],answer:0,why:'Horses rely on hindgut fiber fermentation; forage, water, and careful adjustments are important.'},{name:'Laying hen',emoji:'🐔',prompt:'A laying hen needs nutrients to produce eggs. Which choice best supports that goal?',options:['A balanced layer ration with adequate calcium and water','Only cracked corn','The same feed as a growing beef calf'],answer:0,why:'Laying hens need species- and production-appropriate nutrients, including calcium for eggshell formation.'}];

const state={tab:0,animal:0,organ:0,nutrient:0,caseAnswers:{},visitedAnimals:{0:true},visitedNutrients:{0:true},name:''};const tabs=['🐾 Digestive Explorer','🌾 Nutrient Lab','🪣 Feeding Decisions','✅ Exploration Wrap-Up'];const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function organImage(name){return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function setTab(i){state.tab=i;render()}function setAnimal(i){state.animal=i;state.organ=0;state.visitedAnimals[i]=true;render()}function setOrgan(i){state.organ=i;render()}function setNutrient(i){state.nutrient=i;state.visitedNutrients[i]=true;render()}function pickCase(i,j){state.caseAnswers[i]=j;render()}function next(){setTab(Math.min(3,state.tab+1))}function render(){el('tabs').innerHTML=tabs.map((t,i)=>btn(t,`setTab(${i})`,state.tab===i?'active':'')).join('');let html='';if(state.tab===0){let a=animals[state.animal],o=a.organs[state.organ];html=`<div class="panel"><span class="pill">STATION 1 OF 4</span><h2>Digestive System Explorer</h2><p>Choose an animal, then select each organ to discover what happens to its feed. Follow the pathway from start to finish.</p><div class="grid">${animals.map((x,i)=>`<button class="choice ${i===state.animal?'selected':''}" onclick="setAnimal(${i})"><span class="animal">${x.emoji}</span>${x.name}<br><small>${x.type}</small></button>`).join('')}</div></div><div class="panel"><h2>${a.emoji} ${a.name}: ${a.type}</h2><p>${a.summary}</p><div class="map"><p><strong>Follow the feed:</strong> Select any organ below.</p><div class="path">${a.organs.map((x,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<button class="organ ${i===state.organ?'active':''}" onclick="setOrgan(${i})">${esc(x[0])}</button>`).join('')}</div><div class="detail"><div class="organ-detail-layout"><figure class="organ-picture"><img src="${embeddedOrganImages[organImage(o[0])]}" alt="Simplified educational illustration of ${esc(o[0])}" loading="lazy"><figcaption>Illustration • simplified, not to scale</figcaption></figure><div class="organ-copy"><h3>${esc(o[0])}</h3><p>${esc(o[1])}</p><p><small>Explore another organ in the pathway above.</small></p></div></div></div></div><p class="muted"><strong>Ranch Connection:</strong> Think about why this digestive system affects the feed this animal can use.</p>${btn('Continue to Nutrient Lab →','next()','primary')}</div>`}else if(state.tab===1){let n=nutrients[state.nutrient];html=`<div class="panel"><span class="pill">STATION 2 OF 4</span><h2>Nutrient Discovery Lab</h2><p>All animals need six nutrient classes. Select each one to learn its job and where it comes from.</p><div class="grid">${nutrients.map((x,i)=>`<button class="choice ${i===state.nutrient?'selected':''}" onclick="setNutrient(${i})"><span class="animal">${x[0]}</span>${x[1]}</button>`).join('')}</div></div><div class="panel"><h2>${n[0]} ${n[1]}</h2><div class="muted"><strong>What it does:</strong><p>${n[2]}</p><strong>Possible sources:</strong><p>${n[3]}</p></div><p><strong>Remember:</strong> A balanced ration supplies appropriate amounts of all six classes. More of one nutrient is not automatically better.</p>${btn('Continue to Feeding Decisions →','next()','primary')}</div>`}else if(state.tab===2){let answered=Object.keys(state.caseAnswers).length;html=`<div class="panel"><span class="pill">STATION 3 OF 4</span><h2>Build the Feeding Plan</h2><p>Read each animal profile and select the best management decision. You'll get immediate feedback and can revise your answer.</p><div class="progress"><div style="width:${answered/4*100}%"></div></div><p>${answered} of 4 scenarios attempted</p>${cases.map((c,i)=>`<div class="question"><h3>${c.emoji} Scenario ${i+1}: ${c.name}</h3><p>${c.prompt}</p><div class="grid">${c.options.map((op,j)=>`<button class="choice ${state.caseAnswers[i]===j?'selected':''}" onclick="pickCase(${i},${j})">${esc(op)}</button>`).join('')}</div>${state.caseAnswers[i]!==undefined?`<div class="feedback ${state.caseAnswers[i]===c.answer?'correct':'incorrect'}"><strong>${state.caseAnswers[i]===c.answer?'✓ Good decision!':'↻ Try another approach.'}</strong> ${c.why}</div>`:''}</div>`).join('')}${btn('Continue to Exploration Wrap-Up →','next()','primary')}</div>`}else{let completed=cases.filter((c,i)=>state.caseAnswers[i]===c.answer).length;html=`<div class="panel"><span class="pill">STATION 4 OF 4</span><h2>Exploration Wrap-Up</h2><p>You have explored the digestive systems, investigated nutrients, and practiced feeding decisions. This station helps you prepare for your <strong>separate Canvas Demonstrate 11 quiz</strong>.</p><div class="muted"><h3>Before you move on, can you explain...</h3><ul><li>Why cattle, pigs, horses, and chickens digest feed differently?</li><li>What the rumen, abomasum, cecum, crop, and gizzard do?</li><li>How the six nutrient classes support animal health?</li><li>Why a growing calf, lactating cow, performance horse, and laying hen need different feeding plans?</li></ul></div><h3>Your exploration checklist</h3><p>🐾 Animals opened: <strong>${Object.keys(state.visitedAnimals).length}/4</strong></p><p>🌾 Nutrients opened: <strong>${Object.keys(state.visitedNutrients).length}/6</strong></p><p>🪣 Feeding scenarios answered correctly: <strong>${completed}/4</strong></p><p>Go back to any station to review. When you are ready, return to Canvas and open <strong>Demonstrate 11: Ranch Manager Mastery Challenge</strong>.</p>${btn('← Review Digestive Explorer','setTab(0)')} ${btn('Review Nutrient Lab','setTab(1)')} ${btn('Review Feeding Decisions','setTab(2)','primary')}</div>`}el('content').innerHTML=html;el('report').style.display='none'}render();
